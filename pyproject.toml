[project]
name = "aqi-project"
version = "0.2.0"
description = "AQI Vision: image-based AQI classification (phase 1) and video analysis with detection + tracking (phase 2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "numpy>=2.4.4",
    "opencv-python>=4.9.0",
    "pillow>=12.2.0",
    "python-multipart>=0.0.26",
    "scikit-image>=0.22.0",
    "tensorflow>=2.16.1",
    "uvicorn>=0.44.0",
]

[project.optional-dependencies]
# YOLO11 detection + ByteTrack tracking (Ultralytics, AGPL-3.0)
video = [
    "ultralytics>=8.3.0",
    "lap>=0.5.12",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
